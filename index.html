  return (
    <span
      className={className}
      style={{ fontSize: size, lineHeight: 1, display: "inline-block", color: color || "currentColor" }}
    >
      {children}
    </span>
  );
}
function Search(props) { return <Icon {...props}>{"\u{1F50D}"}</Icon>; }
function Plus(props) { return <Icon {...props}>{"+"}</Icon>; }
function X(props) { return <Icon {...props}>{"\u00D7"}</Icon>; }
function Loader2(props) { return <Icon {...props} className={`spin ${props.className || ""}`}>{"\u27F3"}</Icon>; }

// ---------------------------------------------------------------------------
// window.storage shim — mirrors the get/set(key, value, shared) API this app
// was originally written against, backed by plain localStorage on this device.
// ---------------------------------------------------------------------------
window.storage = {
  async get(key) {
    const v = localStorage.getItem("fitnessTracker:" + key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem("fitnessTracker:" + key, value);
    return { key, value };
  },
};

async function saveToStorage(key, value) {
  try {
    if (!window.storage) {
      console.warn("window.storage not available yet, skipping save for", key);
      return;
    }
    await window.storage.set(key, value, false);
  } catch (err) {
    console.error("storage save failed for", key, err);
  }
}

async function lookupFoodOnline(query, apiKey) {
  if (!apiKey) {
    throw new Error("no-key");
  }
  const prompt =
    `Search the web for nutrition label information about this food or dish: "${query}". ` +
    `Reply with ONLY a raw JSON object and nothing else — no markdown, no code fences, no commentary — ` +
    `in exactly this shape: {"name": string, "calories": number, "serving": string, "protein": number, "fat": number, ` +
    `"satFat": number, "transFat": number, "carbs": number, "fiber": number, "sugar": number, "sodium": number}. ` +
    `"calories" is total kcal for one typical serving, "serving" briefly describes that serving (e.g. "1 cup", "100g"). ` +
    `"protein", "fat", "satFat", "transFat", "carbs", "fiber", and "sugar" are all in grams for that same serving; ` +
    `"sodium" is in milligrams. Use 0 for any value that is negligible or genuinely not present, matching what a ` +
    `typical nutrition label would show. If you cannot find reliable data at all, reply with ` +
    `{"name": "${query.replace(/"/g, "'")}", "calories": null, "serving": ""}.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    throw new Error(`API error ${response.status}: ${errText.slice(0, 200)}`);
  }
  const data = await response.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  const cleaned = text.replace(/```json|```/g, "").trim();
  const match = cleaned.match(/\{[\s\S]*\}/);
  const parsed = JSON.parse(match ? match[0] : cleaned);
  if (!parsed.calories || Number.isNaN(Number(parsed.calories))) {
    throw new Error("No reliable data found");
  }
  const num = (v) => (typeof v === "number" && !Number.isNaN(v) ? v : 0);
  return {
    name: parsed.name || query,
    serving: parsed.serving || "1 serving",
    calories: Math.round(Number(parsed.calories)),
    protein: num(parsed.protein),
    fat: num(parsed.fat),
    satFat: num(parsed.satFat),
    transFat: num(parsed.transFat),
    carbs: num(parsed.carbs),
    fiber: num(parsed.fiber),
    sugar: num(parsed.sugar),
    sodium: num(parsed.sodium),
  };
}

        }
      } catch (e) {
        /* no stored entries yet */
      }
      try {
        const historyRes = await window.storage.get("history", false);
        if (historyRes && historyRes.value) {
          setHistory(JSON.parse(historyRes.value));
        }
      } catch (e) {
        /* no stored history yet */
      }
      try {
        const customRes = await window.storage.get("customFoods", false);
        if (customRes && customRes.value) {
          setCustomFoods(JSON.parse(customRes.value));
        }
      } catch (e) {
        /* no stored custom foods yet */
      }
      try {
        const profileRes = await window.storage.get("profile", false);
        if (profileRes && profileRes.value) {
          const p = JSON.parse(profileRes.value);
          setGender(p.gender || "");
          setAge(p.age || "");
          setWeightKg(p.weightKg || "");

  useEffect(() => {
    if (!loaded) return;
    if (bmrCalculated && bmrCalculated > 0) {
      setBmr(bmrCalculated);
      setBmrDraft(String(bmrCalculated));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [bmrCalculated, loaded]);

  // ---- derived numbers ---------------------------------------------------
  const caloriesIn = useMemo(
    () => entries.filter((e) => e.type === "food").reduce((s, e) => s + e.calories * e.servings, 0),
    [entries]
  );
  const workoutBurn = useMemo(
    () => entries.filter((e) => e.type === "workout").reduce((s, e) => s + e.calories, 0),
    [entries]
  );
  const totalBurn = bmr + workoutBurn;
  const net = caloriesIn - totalBurn;

  const scaleTotal = caloriesIn + totalBurn;
  const balanceRatio = scaleTotal > 0 ? (caloriesIn - totalBurn) / scaleTotal : 0;
  const angle = Math.max(-16, Math.min(16, balanceRatio * 16));

  const macroTotals = useMemo(() => {
    const totals = { protein: 0, fat: 0, satFat: 0, transFat: 0, carbs: 0, fiber: 0, sugar: 0, sodium: 0 };
    entries
      .filter((e) => e.type === "food")
      .forEach((e) => {
        const s = e.servings || 1;
        totals.protein += (e.protein || 0) * s;
        totals.fat += (e.fat || 0) * s;
        totals.satFat += (e.satFat || 0) * s;
        totals.transFat += (e.transFat || 0) * s;
        totals.carbs += (e.carbs || 0) * s;
        totals.fiber += (e.fiber || 0) * s;
        totals.sugar += (e.sugar || 0) * s;
        totals.sodium += (e.sodium || 0) * s;
      });
    return totals;
  }, [entries]);

  const rdaValues = useMemo(() => {
    // FDA 2000-calorie label defaults, used until a profile is filled in
    const fallback = { protein: 50, fat: 78, satFat: 20, transFat: 2, carbs: 275, fiber: 28, sugar: 50, sodium: 2300 };
    const base = bmrCalculated
      ? {
          ...fallback,
          satFat: Math.round((bmrCalculated * 0.1) / 9),
          fiber: gender === "male" ? 38 : 25,
          sugar: gender === "male" ? 36 : 25,
        }
      : fallback;
    return { ...base, protein: 160, fat: 65, carbs: 210 };
  }, [bmrCalculated, gender]);

  const macroChartData = MACRO_FIELDS.map((f) => ({
    name: f.label,
    value: Math.round(macroTotals[f.key] * 10) / 10,
    target: rdaValues[f.key],
    color: f.color,
  }));

  // keep today's rolled-up totals in the persisted history dict
  useEffect(() => {
    if (!loaded) return;
    const key = dateKey.current;
    setHistory((prev) => {
      const existing = prev[key];
      if (existing && existing.in === caloriesIn && existing.burn === totalBurn && existing.net === net) {
        return prev;
      }
      const updated = { ...prev, [key]: { in: caloriesIn, burn: totalBurn, net, bmr } };
      saveToStorage("history", JSON.stringify(updated));
      return updated;
    });
  }, [caloriesIn, totalBurn, net, bmr, loaded]);

  const weeklyAvg = useMemo(() => {
    const vals = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      if (history[key]) vals.push(history[key].net);
    }
    if (vals.length === 0) return null;
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }, [history]);

  const monthlyAvg = useMemo(() => {
    const vals = [];
    const dim = daysInMonth(viewYear, viewMonth);
    for (let day = 1; day <= dim; day++) {
      const key = `${viewYear}-${pad(viewMonth + 1)}-${pad(day)}`;
      if (history[key]) vals.push(history[key].net);
    }
    if (vals.length === 0) return null;
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }, [history, viewYear, viewMonth]);

  function changeMonth(delta) {
    let nm = viewMonth + delta;
    let ny = viewYear;
    if (nm < 0) {
      nm = 11;
      ny -= 1;
    } else if (nm > 11) {
      nm = 0;
      ny += 1;
    }
    setViewMonth(nm);
    setViewYear(ny);
  }

  const monthLabel = new Date(viewYear, viewMonth).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const calendarCells = useMemo(() => {
    const cells = [];
    const lead = firstWeekday(viewYear, viewMonth);
    for (let i = 0; i < lead; i++) cells.push(null);
    const dim = daysInMonth(viewYear, viewMonth);
    for (let day = 1; day <= dim; day++) {
      const key = `${viewYear}-${pad(viewMonth + 1)}-${pad(day)}`;
      cells.push({ day, key, data: history[key] || null, isToday: key === todayKey() });
    }
    return cells;
  }, [viewYear, viewMonth, history]);

  const allFoods = useMemo(() => {
    const overriddenDb = FOOD_DB.map((f) => {
      const custom = customFoods[f.name.toLowerCase()];
      return custom ? { ...f, ...custom, name: f.name } : f;
    });
    const extras = Object.values(customFoods).filter(
      (cf) => !FOOD_DB.some((f) => f.name.toLowerCase() === cf.name.toLowerCase())
    );
    return [...overriddenDb, ...extras];
  }, [customFoods]);

  const matches = useMemo(() => {
    if (!query.trim()) return [];
    const q = query.trim().toLowerCase();
    return allFoods.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 7);
  }, [query, allFoods]);

  function upsertCustomFood(food) {
    const key = food.name.trim().toLowerCase();
    setCustomFoods((prev) => {
      const updated = {
        ...prev,
        [key]: {
          name: food.name.trim(),
          calories: food.calories,
          serving: food.serving,
          source: food.source,
          protein: food.protein || 0,
          fat: food.fat || 0,
          satFat: food.satFat || 0,
          transFat: food.transFat || 0,
          carbs: food.carbs || 0,
          fiber: food.fiber || 0,
          sugar: food.sugar || 0,
          sodium: food.sodium || 0,
        },
      };
      saveToStorage("customFoods", JSON.stringify(updated));
      return updated;
    });
  }

  // ---- actions -------------------------------------------------------------
  function addFoodEntry(food) {
    setEntries((prev) => [
      ...prev,
      {
        id: uid(),
        type: "food",
        name: food.name,
        serving: food.serving,
        calories: food.calories,
        servings: 1,
        source: food.source || "db",
        protein: food.protein || 0,
        fat: food.fat || 0,
        satFat: food.satFat || 0,
        transFat: food.transFat || 0,
        carbs: food.carbs || 0,
        fiber: food.fiber || 0,
        sugar: food.sugar || 0,
        sodium: food.sodium || 0,
      },
    ]);
    if (food.source === "web" || food.source === "manual") {
      upsertCustomFood(food);
    }
    setQuery("");
    setManualOpen(false);
    setManualCal("");
    setManualMacrosOpen(false);
    setManualMacros({ protein: "", fat: "", satFat: "", transFat: "", carbs: "", fiber: "", sugar: "", sodium: "" });
    setLookupError("");
  }

  async function handleWebLookup() {
    if (!apiKey) {
      setLookupError("Add your Anthropic API key in the Profile tab to enable online lookup.");
      return;
    }
    setLookupLoading(true);
    setLookupError("");
    try {
      const result = await lookupFoodOnline(query.trim(), apiKey);
      addFoodEntry({ ...result, source: "web" });
    } catch (e) {
      if (e.message === "no-key") {
        setLookupError("Add your Anthropic API key in the Profile tab to enable online lookup.");
      } else {
        setLookupError("Couldn't find reliable calorie data for that — try entering it manually.");
      }
    } finally {
      setLookupLoading(false);
    }
  }

  function commitApiKey() {
    const trimmed = apiKeyDraft.trim();
    setApiKey(trimmed);
    saveToStorage("apiKey", trimmed);
  }

  function handleManualAdd() {
    const cal = Number(manualCal);
    if (!query.trim() || !cal || cal <= 0) return;
    const num = (v) => {
      const n = Number(v);
      return v !== "" && !Number.isNaN(n) ? n : 0;
    };
    addFoodEntry({
      name: query.trim(),
      serving: manualServing || "1 serving",
      calories: Math.round(cal),
      source: "manual",
      protein: num(manualMacros.protein),
      fat: num(manualMacros.fat),
      satFat: num(manualMacros.satFat),
      transFat: num(manualMacros.transFat),
      carbs: num(manualMacros.carbs),
      fiber: num(manualMacros.fiber),
      sugar: num(manualMacros.sugar),
      sodium: num(manualMacros.sodium),
    });
  }

  function updateManualMacro(key, value) {
    const cleaned = value.replace(/[^0-9.]/g, "");
    setManualMacros((prev) => ({ ...prev, [key]: cleaned }));
  }

  function addWorkout(name, calories) {
    if (!name.trim() || !calories) return;
    setEntries((prev) => [...prev, { id: uid(), type: "workout", name: name.trim(), calories: Math.round(Number(calories)) }]);
    setWorkoutName("");
    setWorkoutCal("");
  }

  function adjustServings(id, delta) {
    setEntries((prev) =>
      prev.map((e) => (e.id === id ? { ...e, servings: Math.max(0.5, Math.round((e.servings + delta) * 2) / 2) } : e))
    );
  }

  function startEdit(entry) {
    const currentTotal = entry.type === "food" ? Math.round(entry.calories * entry.servings) : entry.calories;
    setEditingId(entry.id);
    setEditValue(String(currentTotal));
  }

  function commitEdit(entry) {
    const val = Number(editValue);
    if (!val || val <= 0) {
      setEditingId(null);
      return;
    }
    const rounded = Math.round(val);
    if (entry.type === "workout") {
      setEntries((prev) => prev.map((en) => (en.id === entry.id ? { ...en, calories: rounded } : en)));
    } else {
      const perServing = Math.max(1, Math.round(rounded / (entry.servings || 1)));
      setEntries((prev) => prev.map((en) => (en.id === entry.id ? { ...en, calories: perServing } : en)));
      upsertCustomFood({
        name: entry.name,
        calories: perServing,
        serving: entry.serving,
        source: "edited",
        protein: entry.protein,
        fat: entry.fat,
        satFat: entry.satFat,
        transFat: entry.transFat,
        carbs: entry.carbs,
        fiber: entry.fiber,
        sugar: entry.sugar,
        sodium: entry.sodium,
      });
    }
    setEditingId(null);
  }

  function toggleMacroEdit(entry) {
    if (macroEditId === entry.id) {
      setMacroEditId(null);
      return;
    }
    setMacroDraft({
      protein: String(entry.protein || 0),
      fat: String(entry.fat || 0),
      satFat: String(entry.satFat || 0),
      transFat: String(entry.transFat || 0),

      fiber: String(entry.fiber || 0),
      sugar: String(entry.sugar || 0),
      sodium: String(entry.sodium || 0),

    setMacroDraft((prev) => ({ ...prev, [key]: cleaned }));

  function commitMacroEdit(entry) {

      satFat: num(macroDraft.satFat),
      transFat: num(macroDraft.transFat),
      carbs: num(macroDraft.carbs),
      fiber: num(macroDraft.fiber),
      sugar: num(macroDraft.sugar),
      sodium: num(macroDraft.sodium),
    };
    setEntries((prev) => prev.map((en) => (en.id === entry.id ? { ...en, ...updatedMacros } : en)));
    upsertCustomFood({
      name: entry.name,
      calories: entry.calories,
      serving: entry.serving,
      source: "edited",
      ...updatedMacros,
    });
    setMacroEditId(null);
  }

  function removeEntry(id) {
    setEntries((prev) => prev.filter((e) => e.id !== id));
  }

  function commitBmr() {
    const v = Number(bmrDraft);
    if (v > 0) setBmr(Math.round(v));
    else setBmrDraft(String(bmr));
  }

    () => [...entries].sort((a, b) => 0),
    [entries]
  );

                        placeholder="0"
                        value={macroDraft.sodium}
                        onChange={(ev) => updateMacroDraft("sodium", ev.target.value)}
                      />
                      <span className="manual-macro-unit">mg</span>
                    </label>
                  </div>
                  <div className="macro-edit-actions">
                    <button className="pill-btn" onClick={() => commitMacroEdit(e)}>
                      Save
                    </button>
                    <button className="pill-btn secondary" onClick={() => setMacroEditId(null)}>
                      Cancel
                    </button>
                  </div>
                  <div className="insights-note">These values become the new default for &ldquo;{e.name}&rdquo;.</div>
                </div>
              )}
            </div>
          ))}
        </div>
        )}

        <div className="bmr-row">
          <span className="bmr-label">
            Base metabolic rate
            {bmrCalculated && <span className="bmr-auto-tag"> · from profile</span>}
          </span>
          <div className="bmr-input-group">
            <input
              className="bmr-input"
              value={bmrDraft}
              onChange={(e) => setBmrDraft(e.target.value.replace(/[^0-9]/g, ""))}
              onBlur={commitBmr}
              onKeyDown={(e) => e.key === "Enter" && e.currentTarget.blur()}
              inputMode="numeric"
            />
            <span className="bmr-unit">kcal/day</span>
          </div>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<CalorieLedger />);

</script>
</body>
</html>
